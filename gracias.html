<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Apuntado! · PokerTimba</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#16704b 0%,#0e4d34 50%,#062419 100%);color:#f6f1e4;font:17px/1.55 Archivo,system-ui,sans-serif;text-align:center}
.box{max-width:520px}
.suits{font-size:34px;letter-spacing:8px;margin-bottom:18px}
.suits b{color:#d8303a;font-weight:400}
h1{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:clamp(32px,6vw,46px);line-height:1.05;margin:0 0 16px}
p{color:#b9cdbf;margin:0 0 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;font-weight:700;text-decoration:none}
.red{background:#d8303a;color:#fff}
.ghost{border:2px solid #f6f1e4;color:#f6f1e4}
a:focus-visible{outline:3px solid #e9b949;outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="suits">♠<b>♥</b>♣<b>♦</b></div>
    <h1>¡Ya estás en la lista!</h1>
    <p>Te avisaremos por email en cuanto salgan el curso y la mesa de práctica, con el precio especial de lanzamiento.</p>
    <div class="btns">
      <a class="red" href="/#guia">Ver la guía</a>
      <a class="ghost" href="https://www.youtube.com/@PoKeRtimba" rel="noopener">Ir al canal de YouTube</a>
    </div>
  </div>
</body>
</html>
