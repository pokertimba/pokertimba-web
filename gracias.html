<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Apuntado! · PokerTimba</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1b3a2c 0%,#12241c 45%,#090f0c 100%);color:#efe9dc;font:16.5px/1.6 Inter,system-ui,sans-serif;text-align:center}
.box{max-width:520px}
.suits{font-size:28px;letter-spacing:10px;margin-bottom:18px;color:#c9a45c}
.suits b{color:#c4545a;font-weight:400}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(32px,6vw,46px);line-height:1.05;margin:0 0 16px}
p{color:#a8b3ab;margin:0 0 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:4px;font-weight:600;text-decoration:none}
.red{background:#9e2a2f;color:#fff}
.ghost{border:2px solid rgba(239,233,220,.45);color:#efe9dc}
a:focus-visible{outline:2px solid #c9a45c;outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="suits">♠<b>♥</b>♣<b>♦</b></div>
    <h1>¡Ya estás en la lista!</h1>
    <p>Te avisaremos por email en cuanto salgan el curso y la mesa de práctica, con el precio especial de lanzamiento.</p>
    <div class="btns">
      <a class="red" href="/#guia">Ver la guía</a>
      <a class="ghost" href="https://www.youtube.com/@PoKeRtimba" rel="noopener">Ir al canal de YouTube</a>
    </div>
  </div>
</body>
</html>
